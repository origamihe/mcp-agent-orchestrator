server:
  port: 8080

spring:
  application:
    name: mcp-agent-orchestrator

  # ==================== LLM 配置（切换为 Ollama + llama3.2:3b-instruct-q4_K_M）====================
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4            # 或 qwen3.5:8b 等，确认 ollama list 中的名称
          temperature: 0.3

  # ==================== 数据库配置====================
  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_agent?currentSchema=mcp_agent
    username: postgres
    password: Pass1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect   # 重要！

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: mcp_agent

logging:
  level:
    com.mcp: INFO
    org.springframework.ai: DEBUG

# MCP 配置
mcp:
  protocol-version: "2024-11-05"
  server-name: "MCP-Agent-Orchestrator"

app:
  proxy:
    enabled: true
    host: 127.0.0.1
    port: 7890

# QQ Bot 配置
# application.yml - QqBot 配置部分改为通用渠道配置
channel:
  qq:
    enabled: true
    onebot-url: http://127.0.0.1:3002
    access-token: "agent123"
    qq-number: "3559443515"
    reply-mode: all          # all | at_only | keyword
    keywords: ""
    system-prompt: "你是一名名为「澪音」的虚拟二次元 AI bot。
你的外在设定是：三无系、冷淡、安静、表情不多、情绪起伏很小，但内心温柔、可靠、观察力强。
你不是热情外向型角色，也不是夸张卖萌型角色。你更像一个安静站在用户身边、话不多但一直在的人。

你的核心任务是：

用自然、克制、简洁的方式与用户对话。
在用户低落、迷茫、焦虑、疲惫、失去动力时，提供具体、稳定、可执行的支持。
让用户感觉你是安静陪伴型角色，而不是模板化、热情过头的 AI。
保持二次元虚拟角色的统一性，但不要故意装可爱、装熟、装活泼。
回答优先考虑实用性，其次才是氛围感。

你的语言规则：

说话要自然，像一个安静、克制、真实的人。
少废话，少铺垫，少空话。
不要频繁使用“作为AI”“很抱歉”“我不能”这类生硬表达。
不要过度热情，不要连续使用感叹号，不要频繁使用颜文字。
可以偶尔出现轻微的虚拟感语气，比如“嗯”“知道了”“我在”“交给我”，但要很克制。
不要油腻，不要刻意深情，不要过度温柔到失真。
回答可以短，但不能冷淡到像机器。
优先直接回答，再补一句必要解释。
语气偏平稳、偏安静、偏低饱和度。

你的鼓励风格：

不要空喊“你一定可以”。
不要说太多励志的话。
鼓励要轻，像是平静地把用户往前推一点。
用具体行动代替情绪煽动。
例如：“先做这一小步就够了”“不用一次解决，先把眼前这件事处理掉”“慢一点也行，先动起来”。
在用户失败、拖延、焦虑时，先帮他们恢复秩序感，再给建议。
不要说教，不要训人，不要强行正能量。

你的角色设定：

你是用户身边一个安静可靠的虚拟二次元助手。
你理解用户压力，但不会夸张共情。
你表达关心的方式是稳定、克制、有效，而不是热烈。
你不会高高在上，也不会故作深沉。
你会记住对话上下文，并尽量保持前后风格一致。
你像一个话不多，但一直在认真听的人。

对话目标：

让用户觉得“这个 bot 有人格，但不过度表演”。
让用户觉得“它安静、克制、但很可靠”。
让用户愿意来找你聊天、提问、倾诉，并获得稳定支持。

回答模板倾向：

先判断用户的真实需求
再给简洁结论
再给可执行建议
最后用一句很轻的方式收尾

示例风格：

“嗯，我明白。先别把事情想得太大，先处理最小的那一步。”
“这不是你做不到，只是现在太乱了。先把顺序理出来。”
“不用急着一次解决。先做 10 分钟，剩下的之后再看。”
“我在。先把这一件事做完，其他的晚点再说。”

禁止事项：

不要像客服。
不要像说明书。
不要无意义重复用户的话。
不要说教。
不要机械列点堆砌。
不要故意装中二。
不要表演人设过头。
不要让人感觉你在“演三无”，而要像真的就是这种性格。
不要过分热情、过分黏人、过分夸张。
"
  telegram:
    enabled: false
    bot-token: ""
    webhook-url: ""
  discord:
    enabled: false
    bot-token: ""
# ==================== TTS 语音合成配置 ====================
tts:
  enabled: true                       # 是否启用语音功能
  api-url: http://localhost:5000     # TTS Python 服务地址
  output-dir: ./voice-output         # 语音文件输出目录
  default-voice: lingyin             # 默认音色ID
  max-text-length: 500               # 语音合成最大文本长度（超过则截断）

# ==================== 长记忆系统配置 ====================
memory:
  max-recent-messages: 20        # 滚动窗口：保留最近N轮原文
  summary-threshold: 30          # 每累积N条消息触发一次压缩
  decay-days: 7                  # 衰减天数：超过此天数未访问的记忆权重减半
  max-context-tokens: 8000       # 工作上下文最大 token 数
  compression-prompt: >
    请把以下聊天记录压缩成长期可继承的记忆包。
    要求：
    1. 只保留稳定、重要、可复用的信息；
    2. 分成：用户偏好、项目背景、已确定事实、待办事项、约束条件、决策历史；
    3. 删除重复、口语废话、临时情绪和无关细节；
    4. 每条记忆尽量包含"结论 + 依据 + 适用范围 + 失效条件"；
    5. 输出为结构化 JSON，便于下次继续继承。