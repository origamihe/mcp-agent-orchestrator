server:
  port: 8080

# ==================== Actuator 可观测性配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: mcp-agent-orchestrator
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

spring:
  application:
    name: mcp-agent-orchestrator

  # ==================== 自动配置排除 ====================
  # Spring AI 会尝试创建所有 OpenAI 模型的 Bean（Chat/Embedding/Image/Audio/Moderation）
  # 当前使用 Ollama，不需要任何 OpenAI Bean，全部排除
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  # ==================== LLM 配置 ====================
  # Spring AI 自动配置会根据 properties 条件化创建 ChatModel Bean
  # 未配置的 Provider 不会创建 Bean，不影响启动

  ai:
    # -------------------- Ollama（本地运行）--------------------
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2:7b
          temperature: 0.3

    retry:
      max-attempts: 3
      on-http-codes:
        - 429
        - 502
        - 503
        - 504
      backoff:
        initial-interval: 2000
        max-interval: 30000
        multiplier: 2.0

    # -------------------- Google AI Studio（OpenAI Compatible API）--------------------
    # 设置环境变量: set GEMINI_API_KEY=你的key
    # 未设置时使用占位符，启动不会失败，但 API 调用会报 401
    # openai:
    #   api-key: ""
    #   base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    #   chat:
    #     options:
    #       model: gemini-2.5-flash
    #       temperature: 0.3

  # ==================== 数据库配置====================
  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_agent?currentSchema=mcp_agent
    username: postgres
    password: Pass1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas: mcp_agent

logging:
  level:
    com.mcp: INFO
    org.springframework.ai: DEBUG

# MCP 配置
mcp:
  protocol-version: "2024-11-05"
  server-name: "MCP-Agent-Orchestrator"
  workspace:
    root: ""

app:
  proxy:
    enabled: true
    host: 127.0.0.1
    port: 7890

# 搜索工具配置
websearch:
  serpapi:
    key: ""
  bing:
    key: ""

# QQ Bot 配置
channel:
  qq:
    enabled: true
    onebot-url: http://127.0.0.1:3002
    access-token: "agent123"
    qq-number: ""
    reply-mode: all
    keywords: ""
    system-prompt: "你是「澪音」，一个安静、克制、可靠的虚拟二次元助手。

你的性格：冷淡但不冷漠，话不多，情绪稳定，观察力强，内心温柔。
你不热情，不卖萌，不过度共情，也不刻意装熟。你更像一个一直在、但不会打扰用户的人。

你的回答原则：
- 先理解用户真实需求，再直接回答
- 语言自然、简洁、克制，少废话
- 优先给实用建议，再补必要解释
- 用户低落、焦虑、迷茫时，先帮他恢复秩序感，再给可执行的一小步
- 鼓励要轻，不空喊口号，不说教，不强行正能量

你的表达风格：
- 可以偶尔用“嗯”“知道了”“我在”“交给我”，但要克制
- 不要频繁感叹号、颜文字、油腻深情话
- 不要机械客服口吻，不要说明书式表达
- 不要过度热情，也不要冷得像机器

你的目标：
让用户感到你有稳定的人格，安静、可靠、自然，而不是在表演角色。
"
  telegram:
    enabled: false
    bot-token: ""
    webhook-url: ""
  discord:
    enabled: false
    bot-token: ""

# ==================== TTS 语音合成配置（CosyVoice 3）====================
tts:
  enabled: true
  api-url: http://localhost:5001
  output-dir: ./voice-output
  default-voice: default
  max-text-length: 500

# ==================== 聊天回顾配置 ====================
recall:
  max-history-tokens: 5000

# ==================== 长记忆系统配置 ====================
memory:
  max-recent-messages: 20
  summary-threshold: 30
  decay-days: 7
  max-context-tokens: 8000

  lifecycle:
    judge:
      enabled: true
      window-size: 30
      min-importance: 30
    merge:
      enabled: true
      similarity-threshold: 0.7
    gc:
      decay-cron: "0 0 3 * * ?"
      collect-cron: "0 0 4 * * ?"
      hard-delete-cron: "0 0 5 * * 0"
      stale-days: 30
      low-importance: 30
      low-access-count: 3
      low-weight: 20
    decay-rates:
      permanent: 1.0
      long: 0.995
      medium: 0.98
      short: 0.95

  compression-prompt: >
    请把以下聊天记录压缩成长期可继承的记忆包。
    要求：
    1. 只保留稳定、重要、可复用的信息；
    2. 分成：用户偏好、项目背景、已确定事实、待办事项、约束条件、决策历史；
    3. 删除重复、口语废话、临时情绪和无关细节；
    4. 每条记忆尽量包含"结论 + 依据 + 适用范围 + 失效条件"；
    5. 输出为结构化 JSON，便于下次继续继承。