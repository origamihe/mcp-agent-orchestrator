﻿﻿﻿﻿server:
  port: 8080

spring:
  application:
    name: mcp-agent-orchestrator

  # ==================== LLM 配置（切换为 Ollama + llama3.2:3b-instruct-q4_K_M）====================
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: granite3.2:8b        # 或 qwen3.5:8b 等，确认 ollama list 中的名称gemma4 qwen2.5:7b granite3.2:8b  gemma3:12b
          temperature: 0.3

  # ==================== 数据库配置====================
  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_agent?currentSchema=mcp_agent
    username: postgres
    password: Pass1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect   # 重要！

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas: mcp_agent

logging:
  level:
    com.mcp: INFO
    org.springframework.ai: DEBUG

# MCP 配置
mcp:
  protocol-version: "2024-11-05"
  server-name: "MCP-Agent-Orchestrator"
  workspace:
    root: ""

app:
  proxy:
    enabled: true
    host: 127.0.0.1
    port: 7890

# QQ Bot 配置
# application.yml - QqBot 配置部分改为通用渠道配置
channel:
  qq:
    enabled: true
    onebot-url: http://127.0.0.1:3002
    access-token: "agent123"
    qq-number: ""
    reply-mode: all          # all | at_only | keyword
    keywords: ""
    system-prompt: ""
  telegram:
    enabled: false
    bot-token: ""
    webhook-url: ""
  discord:
    enabled: false
    bot-token: ""
# ==================== TTS 语音合成配置（CosyVoice 3）====================
tts:
  enabled: true                       # 是否启用语音功能
  api-url: http://localhost:5001     # CosyVoice 3 Python 服务地址
  output-dir: ./voice-output         # 语音文件输出目录
  default-voice: default             # 默认音色ID（CosyVoice 3 预置音色或 clone 音色）
  max-text-length: 500               # 语音合成最大文本长度（超过则截断）

# ==================== 聊天回顾配置 ====================
recall:
  max-history-tokens: 5000        # 回顾历史最大 token 预算（默认 5000，可按模型上下文调整）

# ==================== 长记忆系统配置 ====================
memory:
  max-recent-messages: 20        # 滚动窗口：保留最近N轮原文
  summary-threshold: 30          # 每累积N条消息触发一次压缩
  decay-days: 7                  # 衰减天数：超过此天数未访问的记忆权重减半
  max-context-tokens: 8000       # 工作上下文最大 token 数

  # ===== 记忆生命周期配置 =====
  lifecycle:
    judge:
      enabled: true              # 是否启用 Memory Judge（LLM 判断）
      window-size: 30            # 每次送入 Judge 的最近消息数
      min-importance: 30         # 低于此分数的记忆直接丢弃
    merge:
      enabled: true              # 是否启用 Memory Merge（相似记忆合并）
      similarity-threshold: 0.7  # 相似度阈值（0-1）
    gc:
      decay-cron: "0 0 3 * * ?"       # 衰减执行时间（默认每日凌晨3点）
      collect-cron: "0 0 4 * * ?"      # 垃圾回收执行时间（默认每日凌晨4点）
      hard-delete-cron: "0 0 5 * * 0"  # 硬删除执行时间（默认每周日凌晨5点）
      stale-days: 30             # 超过此天数未访问的视为过期
      low-importance: 30         # 重要性低于此值的可被回收
      low-access-count: 3        # 访问次数低于此值的可被回收
      low-weight: 20             # 权重低于此值的自动软删除
    decay-rates:
      permanent: 1.0             # 永久记忆不衰减
      long: 0.995                # 长期记忆每日衰减 0.5%
      medium: 0.98               # 中期记忆每日衰减 2%
      short: 0.95                # 短期记忆每日衰减 5%

  compression-prompt: >
    请把以下聊天记录压缩成长期可继承的记忆包。
    要求：
    1. 只保留稳定、重要、可复用的信息；
    2. 分成：用户偏好、项目背景、已确定事实、待办事项、约束条件、决策历史；
    3. 删除重复、口语废话、临时情绪和无关细节；
    4. 每条记忆尽量包含"结论 + 依据 + 适用范围 + 失效条件"；
    5. 输出为结构化 JSON，便于下次继续继承。