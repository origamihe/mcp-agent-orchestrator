server:
  port: 8081

spring:
  application:
    name: mcp-agent-orchestrator

  ai:
    google:
      genai:
        api-key:
        #gemini-2.0-flash、gemini-2.5-flash-lite、gemini-2.5-pro 任选
        chat:
          options:
            model: gemini-2.5-flash-lite
            temperature: 0.7
  datasource:
    url: jdbc:mysql://localhost:3306/mcp_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Pass1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: mcp_agent

logging:
  level:
    com.mcp: INFO
    org.springframework.ai: DEBUG

# MCP 配置
mcp:
  protocol-version: "2024-11-05"
  server-name: "MCP-Agent-Orchestrator"